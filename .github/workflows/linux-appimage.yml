name: Linux AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The build machine's glibc is the oldest the AppImage runs on: this is the
    # oldest Ubuntu GitHub still offers.
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0

      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run python -c "import eecc_redact; print(eecc_redact.__version__)")
          test "v$version" = "${{ github.ref_name }}" || {
            echo "Tag ${{ github.ref_name }} does not match eecc-redact $version"; exit 1; }

      - name: Qt and D-Bus runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus file libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - run: dbus-run-session -- uv run pytest -q

      - run: packaging/linux/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: eecc-redact-linux-appimage
          path: |
            dist/eecc-redact-*.AppImage
            dist/eecc-redact-*.AppImage.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/eecc-redact-*.AppImage
            dist/eecc-redact-*.AppImage.sha256
