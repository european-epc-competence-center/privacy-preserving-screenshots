name: Linux AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The build machine's glibc is the oldest the AppImage runs on: this is the
    # oldest Ubuntu GitHub still offers.
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0

      - name: Set the package version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run python packaging/set_release_version.py --push

      - name: Qt and D-Bus runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus file libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - run: dbus-run-session -- uv run pytest -q

      - run: packaging/linux/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: eecc-redact-linux-appimage
          path: |
            dist/eecc-redact-*.AppImage
            dist/eecc-redact-*.AppImage.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/eecc-redact-*.AppImage
            dist/eecc-redact-*.AppImage.sha256
