name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0  # no floating major tag is published

      - name: Qt and D-Bus runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

      - name: Tests (with a session bus for the portal tests)
        if: runner.os == 'Linux'
        run: dbus-run-session -- uv run pytest -q

      - name: Tests
        if: runner.os == 'Windows'
        run: uv run pytest -q
