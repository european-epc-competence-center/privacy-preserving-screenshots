name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0

      - name: Set the package version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run python packaging/set_release_version.py --push

      - run: uv run pytest -q

      - run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: packaging\windows\build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: eecc-redact-windows-installer
          path: |
            dist/eecc-redact-setup-*.exe
            dist/eecc-redact-setup-*.exe.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/eecc-redact-setup-*.exe
            dist/eecc-redact-setup-*.exe.sha256
